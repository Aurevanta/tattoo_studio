# The studio, deployed by Coolify (ADR-0020, amended by TASK-0044).
#
#   coolify's proxy ──▶ web:3000 ──▶ worker:8000 ──▶ /data (encrypted media, SQLite)
#
# No service publishes a host port. Coolify already owns 80 and 443 on this host and terminates
# TLS itself; binding them here would simply fail to start. The domain is attached to `web` in
# Coolify, which is also what issues and renews the certificate.
#
# The worker is reachable only on this compose network. It holds the media store and the
# generation credentials, and its only caller is the web app, which authenticates with
# TATTOO_WORKER_TOKEN.

name: tattoo-studio

services:
  worker:
    build:
      # Relative to the compose *project directory*, which Coolify sets to the repository root
      # (not to this file's folder). `..` pointed above the root and the build could not resolve.
      context: .
      dockerfile: infra/Dockerfile.worker
    environment:
      TATTOO_ENVIRONMENT: production
      TATTOO_DATA_DIR: /data/studio
      TATTOO_WORKER_TOKEN: ${TATTOO_WORKER_TOKEN:?set it in Coolify}
      TATTOO_MEDIA_KEY: ${TATTOO_MEDIA_KEY:?set it in Coolify}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set it in Coolify}
      TATTOO_IMAGE_BACKEND: ${TATTOO_IMAGE_BACKEND:-openai}
      BFL_API_KEY: ${BFL_API_KEY:-}
      # TASK-0078 (audit SEG-02): daily limits; empty keeps the defaults (20, 300, 100).
      TATTOO_DAILY_DESIGNS: ${TATTOO_DAILY_DESIGNS:-20}
      TATTOO_DAILY_DESIGNS_TOTAL: ${TATTOO_DAILY_DESIGNS_TOTAL:-300}
      TATTOO_DAILY_TURNS: ${TATTOO_DAILY_TURNS:-100}
      # TASK-0115: uploaded images per account per day; empty keeps the default (30).
      TATTOO_DAILY_UPLOADS: ${TATTOO_DAILY_UPLOADS:-30}
      # TASK-0052: which BFL cluster draws the skin plates. EU by default; set it in Coolify to
      # https://api.bfl.ai to route round an EU incident. Only a text prompt goes to BFL, never a
      # photograph, so this moves no client image out of Europe.
      TATTOO_BFL_BASE_URL: ${TATTOO_BFL_BASE_URL:-https://api.eu.bfl.ai}
      # TASK-0054: monitoring. Without a DSN, events are kept in SQLite on the worker's volume.
      TATTOO_TELEMETRY_DSN: ${TATTOO_TELEMETRY_DSN:-}
      TATTOO_PRICES: ${TATTOO_PRICES:-}
      TATTOO_TELEMETRY_RETENTION_DAYS: ${TATTOO_TELEMETRY_RETENTION_DAYS:-365}
    volumes:
      - worker-data:/data
    restart: unless-stopped
    # Exactly one replica: the job queue runs in a thread inside this process, and two schedulers
    # over one SQLite file would hand the same job to both.
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The domain is attached to this service in Coolify's own UI (Domains for web, port 3000).
  # Do not declare SERVICE_FQDN_WEB_3000 here: giving it a value -- even an empty default --
  # makes every compose read overwrite the domain Coolify holds, and it silently will not save.
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      NODE_ENV: production
      TATTOO_WORKER_URL: http://worker:8000
      TATTOO_WORKER_TOKEN: ${TATTOO_WORKER_TOKEN:?set it in Coolify}
      # The consultation agent runs inside the web app, not the worker.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # TASK-0070: the free text moderation on the client's words (with a live consultation).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TATTOO_CONSULTATION_BACKEND: ${TATTOO_CONSULTATION_BACKEND:-}
      # TASK-0045: without these the studio refuses every caller rather than opening the door.
      SUPABASE_URL: ${SUPABASE_URL:?set it in Coolify}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set it in Coolify}
      TATTOO_SCOUT_PLANNER: ${TATTOO_SCOUT_PLANNER:-}
      # TASK-0068: web image search for essential references (logos, crests). Both are needed.
      TATTOO_WEB_IMAGE_SEARCH: ${TATTOO_WEB_IMAGE_SEARCH:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    expose:
      - '3000'
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # The encrypted media store and both SQLite files. Losing this volume loses every design; losing
  # TATTOO_MEDIA_KEY makes what is in it unreadable.
  worker-data:
