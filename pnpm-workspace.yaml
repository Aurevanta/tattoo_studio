packages:
  - 'apps/*'
  - 'packages/*'
  - 'contracts'

# Packages permitted to run install scripts. Allowed individually and deliberately:
# a blanket approval would let any transitive dependency execute code at install time.
# esbuild's postinstall links its platform binary, which vitest requires.
allowBuilds:
  esbuild: true

# TASK-0083 (audit SEG-03): Next pins postcss 8.4.31, which carries four advisories
# (GHSA-6g55-p6wh-862q and its incomplete fixes). The same major line, patched, is compatible.
overrides:
  next>postcss: ^8.5.28
  # TASK-0092 (audit 2026-10-08 SEG-04): patched lines of two advisories reached through Next.
  postcss>source-map-js: ^1.2.2
  next>sharp: ^0.35.5
